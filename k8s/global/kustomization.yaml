---
# Reconciled by Flux as `cluster-global`. ./bootstrap is deliberately not
# listed: it is applied once by bootstrap/scripts/bootstrap.sh, and Flux
# then manages its own upgrades through the `flux` Kustomization
# (k8s/clusters/<cluster>/flux/config/flux.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./config
  - ./sources
