apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "satisfactory-${SECRET__TERTIARY_DOMAIN/./-}"
  namespace: default
spec:
  secretName: &host "satisfactory.${SECRET__TERTIARY_DOMAIN}"
  issuerRef:
    name: "${CERT_DEFAULT_CLUSTERISSUER}"
    kind: ClusterIssuer
  commonName: *host
  dnsNames:
  - *host
