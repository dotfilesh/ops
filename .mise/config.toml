# Tooling for this repo: `mise install`, then `just` lists the recipes.
# Pick the cluster with CLUSTER=<name> (default kclt-01).
min_version = "2026.7.0"

[env]
CLUSTER = "{{ get_env(name='CLUSTER', default='kclt-01') }}"
KUBECONFIG = "{{ config_root }}/talos/clusters/{{ get_env(name='CLUSTER', default='kclt-01') }}/kubeconfig"
TALOSCONFIG = "{{ config_root }}/talos/clusters/{{ get_env(name='CLUSTER', default='kclt-01') }}/talosconfig"
SOPS_CONFIG = "{{ config_root }}/.sops.yaml"

[tools]
age = "1.3.2"
flux2 = "2.9.6"
gum = "2.0.2"
helm = "4.3.0"
helmfile = "1.8.1"
jq = "1.8.2"
just = "1.58.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
pre-commit = "4.6.2"
sops = "3.13.3"
talosctl = "1.14.4"
yq = "4.54.1"
"github:home-operations/flate" = "v0.6.5"
"github:postfinance/topf" = "v0.6.1"
