---
# kubernetes/apps/networking/ingress-nginx/helm-release.yaml
# Source plan: ops-rebuild-plan.md §2026 — networking/ingress-nginx
# ingress-nginx v4.x — HTTP ingress controller.
# Assigned LoadBalancer IP: 10.64.3.2 (Cilium BGP pool, see cluster-config.yaml)
# Chart: ingress-nginx/ingress-nginx
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  labels:
    ops.dotfile.sh/cluster: kclt-01
    ops.dotfile.sh/namespace: networking
  annotations:
    ops.dotfile.sh/source-plan: "ops-rebuild-plan.md §2026"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    # renovate: registryUrl=https://kubernetes.github.io/ingress-nginx chart=ingress-nginx
    targetRevision: "4.12.1"
    helm:
      valuesObject:
        controller:
          # Request the Cilium-managed LB IP from the 10.64.3.0/24 pool
          service:
            loadBalancerIP: "10.64.3.2"
            annotations:
              # Tells Cilium to use the BGP pool for this service
              io.cilium/lb-ipam-pool: default
          # Forward real client IPs via Cloudflare/proxy
          config:
            use-forwarded-headers: "true"
            proxy-real-ip-cidr: "0.0.0.0/0"
            # HSTS
            hsts: "true"
            hsts-include-subdomains: "true"
          # Metrics for kube-prometheus-stack
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          # Ingress class
          ingressClassResource:
            default: true
  destination:
    server: https://kubernetes.default.svc
    namespace: networking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
