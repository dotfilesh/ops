---
# kubernetes/apps/kube-system/cilium/helm-release.yaml
# Source plan: ops-rebuild-plan.md §2026 — kube-system/cilium
# Cilium v1.16.x — CNI, BGP control plane, L2 announcements, kube-proxy replacement.
# AS: 65420  LB pool: 10.64.3.0/24  (see cluster-config.yaml)
# Chart: cilium/cilium
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    ops.dotfile.sh/cluster: kclt-01
    ops.dotfile.sh/namespace: kube-system
  annotations:
    ops.dotfile.sh/source-plan: "ops-rebuild-plan.md §2026"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    # renovate: registryUrl=https://helm.cilium.io chart=cilium
    targetRevision: "1.16.6"
    helm:
      valuesObject:
        # Replace kube-proxy entirely (Talos sets proxy.disabled=true)
        kubeProxyReplacement: true
        k8sServiceHost: "127.0.0.1"
        k8sServicePort: "7445"
        # BGP control plane (AS 65420, peers on 10.64.0.1)
        bgpControlPlane:
          enabled: true
        # L2 announcements for load balancer IPs
        l2announcements:
          enabled: true
        # Hubble observability
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
        # IPAM
        ipam:
          mode: kubernetes
        # Node-to-node encryption
        encryption:
          enabled: false
          type: wireguard
        # Host routing / direct node routes
        autoDirectNodeRoutes: true
        # MTU — nodes use jumbo frames (9000)
        MTU: 9000
        # Prometheus integration
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
        operator:
          prometheus:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
