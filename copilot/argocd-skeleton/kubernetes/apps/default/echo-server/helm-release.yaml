---
# kubernetes/apps/default/echo-server/helm-release.yaml
# Source plan: ops-rebuild-plan.md §2026 — default/echo-server
# echo-server — simple HTTP echo service used for network connectivity tests.
# Chart: ealenn/echo-server
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-server
  namespace: argocd
  labels:
    ops.dotfile.sh/cluster: kclt-01
    ops.dotfile.sh/namespace: default
  annotations:
    ops.dotfile.sh/source-plan: "ops-rebuild-plan.md §2026"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://ealenn.github.io/charts
    chart: echo-server
    # renovate: registryUrl=https://ealenn.github.io/charts chart=echo-server
    targetRevision: "0.5.0"
    helm:
      valuesObject:
        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: echo.dotfile.sh
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: echo-server-tls
              hosts:
                - echo.dotfile.sh
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
