---
# kubernetes/clusters/kclt-01/argocd/apps/root-app.yaml
# Source plan: ops-rebuild-plan.md §2026 — app-of-apps bootstrap pattern
# The Root Application points ArgoCD at the cluster's ApplicationSet directory.
# Applying this file bootstraps the entire app-of-apps tree.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Cascading delete disabled on root — prevents accidental full teardown
  finalizers: []
  annotations:
    # Reference the plan section for traceability
    ops.dotfile.sh/source-plan: "ops-rebuild-plan.md §2026"
spec:
  project: default
  source:
    repoURL: https://github.com/dotfilesh/ops.git
    targetRevision: HEAD
    path: copilot/argocd-skeleton/kubernetes/clusters/kclt-01/argocd/applicationsets
    # Build with kustomize + KSOPS plugin enabled
    plugin:
      name: kustomize-with-ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
