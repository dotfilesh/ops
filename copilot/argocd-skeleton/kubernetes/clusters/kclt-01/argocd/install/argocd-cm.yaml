---
# kubernetes/clusters/kclt-01/argocd/install/argocd-cm.yaml
# Source plan: ops-rebuild-plan.md §2026 — ArgoCD + KSOPS config
# Configures the KSOPS exec plugin and common ArgoCD settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable the KSOPS kustomize exec plugin (age-only, per plan §2026)
  kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

  # Cluster domain — used for OIDC redirects, notifications, etc.
  url: "https://argocd.dotfile.sh"

  # Timeouts
  timeout.reconciliation: 180s
  timeout.hard.reconciliation: 0s

  # OIDC (Authentik) — placeholder, populate secret values separately
  # oidc.config: |
  #   name: Authentik
  #   issuer: https://auth.dotfile.sh/application/o/argocd/
  #   clientID: argocd
  #   clientSecret: $argocd-oidc-secret:oidc.clientSecret
  #   requestedScopes: ["openid", "profile", "email", "groups"]

  # Resource tracking annotation
  application.instanceLabelKey: argocd.argoproj.io/app-name
