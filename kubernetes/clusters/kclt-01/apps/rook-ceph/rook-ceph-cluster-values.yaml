---
# kclt-01 storage layout, merged into the shared rook-ceph-cluster HelmRelease.
#
# Disks by WWN vendor prefix: lailah + verus each have 2 Intel SSDs
# (0x55cd2e…) and 1 HDD; mastema has 8 Toshiba drives (assumed HDD).
# Only two hosts have SSDs, so no pool may be pinned to the ssd class with
# size 3 / failureDomain host (it could never place three replicas). Pools
# below either span every device or use the hdd class, present on 3 hosts.
# Check `ceph osd tree` after the first boot and revisit.
cephClusterSpec:
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: lailah
        devices:
          - name: /dev/disk/by-id/wwn-0x55cd2e404c1ca321
          - name: /dev/disk/by-id/wwn-0x55cd2e414d948115
          - name: /dev/disk/by-id/wwn-0x5000c500dc5504c0
      - name: verus
        devices:
          - name: /dev/disk/by-id/wwn-0x55cd2e404c1ca2fd
          - name: /dev/disk/by-id/wwn-0x55cd2e414d94853c
          - name: /dev/disk/by-id/wwn-0x50014ee6070ecea1
      - name: mastema
        devices:
          - name: /dev/disk/by-id/wwn-0x500003975850e40d
          - name: /dev/disk/by-id/wwn-0x500003975850df09
          - name: /dev/disk/by-id/wwn-0x50000397585306fd
          - name: /dev/disk/by-id/wwn-0x50000396f8325511
          - name: /dev/disk/by-id/wwn-0x50000396f8325375
          - name: /dev/disk/by-id/wwn-0x50000396b80b1a15
          - name: /dev/disk/by-id/wwn-0x50000396f8329825
          - name: /dev/disk/by-id/wwn-0x50000396f8325515

cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: host
      replicated:
        size: 3
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        imageFormat: "2"
        imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4

cephFileSystems:
  - name: ceph-filesystem
    spec:
      metadataPool:
        replicated:
          size: 3
      dataPools:
        - failureDomain: host
          replicated:
            size: 3
          name: data0
      metadataServer:
        activeCount: 1
        activeStandby: true
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
    storageClass:
      enabled: true
      isDefault: false
      name: ceph-filesystem
      pool: data0
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4
  # Bulk media (Jellyfin library, Immich uploads) on spinning disks
  - name: ceph-filesystem-hdd
    spec:
      metadataPool:
        replicated:
          size: 3
      dataPools:
        - failureDomain: host
          deviceClass: hdd
          replicated:
            size: 3
          name: data0
      metadataServer:
        activeCount: 1
        activeStandby: true
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
    storageClass:
      enabled: true
      isDefault: false
      name: ceph-filesystem-hdd
      pool: data0
      reclaimPolicy: Retain
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4

cephObjectStores:
  - name: ceph-objectstore
    spec:
      metadataPool:
        failureDomain: host
        replicated:
          size: 3
      # Replicated, not EC 2+1: with exactly three storage hosts EC's
      # min_size (k+1=3) would block writes whenever one host is down.
      dataPool:
        failureDomain: host
        replicated:
          size: 3
      preservePoolsOnDelete: true
      gateway:
        port: 80
        instances: 2
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
      healthCheck:
        bucket:
          interval: 60s
    storageClass:
      enabled: true
      name: ceph-bucket
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      parameters:
        region: us-east-1
