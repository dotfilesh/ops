---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: domain-public
spec:
  dnsNames:
    - "${SECRET_DOMAIN_PUBLIC}"
    - "*.${SECRET_DOMAIN_PUBLIC}"
  issuerRef:
    name: ${CLUSTER_ISSUER}
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: domain-public-tls
  usages:
    - digital signature
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: domain-tertiary
spec:
  dnsNames:
    - "${SECRET_DOMAIN_TERTIARY}"
    - "*.${SECRET_DOMAIN_TERTIARY}"
  issuerRef:
    name: ${CLUSTER_ISSUER}
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: domain-tertiary-tls
  usages:
    - digital signature
