---
# kubernetes/apps/default/echo-server/helm-release.yaml
# echo-server — simple HTTP echo service used for network connectivity tests.
# renovate: registryUrl=https://ealenn.github.io/charts chart=echo-server
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-server
  namespace: argocd
  labels:
    ops.dotfile.sh/cluster: kclt-01
    ops.dotfile.sh/namespace: default
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://ealenn.github.io/charts
    chart: echo-server
    # renovate: registryUrl=https://ealenn.github.io/charts chart=echo-server
    targetRevision: "0.5.0"
    helm:
      valuesObject:
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
