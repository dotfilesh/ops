---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-server
  namespace: default
spec:
  parentRefs:
    - name: external-gateway
      namespace: networking
  hostnames:
    - echo.dotfile.sh
  rules:
    - backendRefs:
        - name: echo-server
          port: 80
