---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chartRef:
    kind: OCIRepository
    name: echo
  interval: 1h
  values:
    replicaCount: 2
    config:
      kubernetes: true
      trustedProxies:
        - ${CLUSTER_POD_CIDR}
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}-${CLUSTER_NAME}.${SECRET_DOMAIN_PUBLIC}"
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
