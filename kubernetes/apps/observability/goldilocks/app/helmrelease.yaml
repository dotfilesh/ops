---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  chartRef:
    kind: OCIRepository
    name: goldilocks
  interval: 1h
  values:
    # Ships the Fairwinds VPA (recommender only) as a subchart; Goldilocks
    # only reads recommendations, nothing is resized automatically.
    vpa:
      enabled: true
      updater:
        enabled: false
      admissionController:
        enabled: false
    controller:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 256Mi
    dashboard:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 128Mi
