---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    crds:
      enabled: true
    cleanPrometheusOperatorObjectNames: true
    # Grafana runs as its own release (observability/grafana)
    grafana:
      enabled: false
      forceDeployDashboards: true
    # Talos control plane: metrics endpoints opened in talos/.../control-plane
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on every control-plane node
    kubeControllerManager:
      service:
        selector:
          component: kube-controller-manager
    kubeScheduler:
      service:
        selector:
          component: kube-scheduler
    kubeProxy:
      enabled: false # Cilium replaces kube-proxy
    kube-state-metrics:
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager-${CLUSTER_NAME}.${SECRET_DOMAIN_PUBLIC}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${CLUSTER_STORAGE_BLOCK}
              resources:
                requests:
                  storage: 1Gi
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus-${CLUSTER_NAME}.${SECRET_DOMAIN_PUBLIC}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
      prometheusSpec:
        # Pick up monitors/rules from every chart, not just this release
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        retention: 14d
        retentionSize: 45GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ${CLUSTER_STORAGE_BLOCK}
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi
