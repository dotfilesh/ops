---
# kubernetes/apps/database/cloudnative-pg/helm-release.yaml
# CloudNative PG v0.22.x — PostgreSQL operator.
# Manages all CNPG clusters across namespaces (auth, monitoring, default, etc.)
# Chart: cloudnative-pg/cloudnative-pg
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  labels:
    ops.dotfile.sh/cluster: kclt-01
    ops.dotfile.sh/namespace: database
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    # renovate: registryUrl=https://cloudnative-pg.github.io/charts chart=cloudnative-pg
    targetRevision: "0.22.1"
    helm:
      valuesObject:
        monitoring:
          podMonitorEnabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
