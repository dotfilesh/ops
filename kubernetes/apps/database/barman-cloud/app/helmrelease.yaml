---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# CNPG backup plugin (replaces the deprecated in-tree barmanObjectStore).
# Postgres clusters opt in per cluster with an ObjectStore + plugin config.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
spec:
  chartRef:
    kind: OCIRepository
    name: barman-cloud
  interval: 1h
  values:
    crds:
      create: true
