---
# kubernetes/apps/security/kyverno/helm-release.yaml
# Kyverno v3.x — Kubernetes policy engine.
# Used for: secret replication, image policies, resource defaults.
# Chart: kyverno/kyverno
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    ops.dotfile.sh/cluster: kclt-01
    ops.dotfile.sh/namespace: security
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    # renovate: registryUrl=https://kyverno.github.io/kyverno chart=kyverno
    targetRevision: "3.3.7"
    helm:
      valuesObject:
        # HA mode — 3 replicas for each component
        admissionController:
          replicas: 3
        backgroundController:
          replicas: 2
        cleanupController:
          replicas: 2
        reportsController:
          replicas: 2
        # Prometheus metrics
        grafana:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
