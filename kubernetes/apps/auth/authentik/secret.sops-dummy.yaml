---
# Dummy secret — copy to secret.sops.yaml and encrypt with:
#   task encrypt FILE=kubernetes/apps/auth/authentik/secret.sops.yaml
#
# Authentik reads these as environment variables via envFrom.secretRef.
# Variable names follow Authentik's AUTHENTIK_* env var convention.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secret
  namespace: auth
type: Opaque
stringData:
  AUTHENTIK_SECRET_KEY: "CHANGE-ME-dummy-secret-key"
  AUTHENTIK_POSTGRESQL__PASSWORD: "CHANGE-ME-dummy-db-pass"
  AUTHENTIK_EMAIL__HOST: "CHANGE-ME-smtp.example.com"
  AUTHENTIK_EMAIL__PORT: "587"
  AUTHENTIK_EMAIL__USERNAME: "CHANGE-ME-user@example.com"
  AUTHENTIK_EMAIL__PASSWORD: "CHANGE-ME-dummy-smtp-pass"
  AUTHENTIK_EMAIL__FROM: "CHANGE-ME-noreply@example.com"
  AUTHENTIK_EMAIL__USE_TLS: "true"
  AUTHENTIK_EMAIL__USE_SSL: "false"
