---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: auth
spec:
  parentRefs:
    - name: external-gateway
      namespace: networking
  hostnames:
    - auth.dotfile.sh
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
