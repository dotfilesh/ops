---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secret
stringData:
  AUTHENTIK_SECRET_KEY: ${SECRET_AUTHENTIK_SECRET_KEY}
  AUTHENTIK_EMAIL__HOST: ${SECRET_SMTP_HOST}
  AUTHENTIK_EMAIL__PORT: "${SECRET_SMTP_PORT}"
  AUTHENTIK_EMAIL__USERNAME: ${SECRET_SMTP_USERNAME}
  AUTHENTIK_EMAIL__PASSWORD: ${SECRET_SMTP_PASSWORD}
  AUTHENTIK_EMAIL__FROM: ${SECRET_SMTP_FROM}
  AUTHENTIK_EMAIL__USE_TLS: "true"
